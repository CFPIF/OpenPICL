# 生产部署（ArgoCD 追踪）：单机 kind 集群，全部组件单副本，经 Envoy Gateway 对外暴露。

gateway:
  create: true
  className: envoy
  # HTTPS：cert-manager 依据 Gateway 的 HTTPS listener 签发共用证书 openpicl-tls（HTTP-01 验证）。
  # 新增域名前需先完成解析并确保 80 端口可从公网访问，否则整张证书签发失败，
  # 而 HTTP 又会跳转到 HTTPS，导致全部站点不可用。可先用 letsencrypt-staging 验证。
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: true

studio:
  enabled: true

webide:
  enabled: true

website:
  enabled: true

docs:
  enabled: true
