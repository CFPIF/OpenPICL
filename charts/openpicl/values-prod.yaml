# 生产部署（ArgoCD 追踪）：单机 kind 集群，全部组件单副本，经 Envoy Gateway 对外暴露。

gateway:
  create: true
  className: envoy
  # 开启 HTTPS：所有启用组件的域名（含 openpicl.com 与 www）都需解析到本机且 80 端口可从公网访问，
  # 否则共用证书 openpicl-tls 签发失败，而 HTTP 又会跳转到 HTTPS，导致全部站点不可用。
  # 先用 letsencrypt-staging 验证，成功后改为 letsencrypt-prod 并删除 openpicl-tls Secret 触发重签。
  # annotations:
  #   cert-manager.io/cluster-issuer: letsencrypt-staging
  tls:
    enabled: false

studio:
  enabled: true

webide:
  enabled: true

website:
  enabled: true

docs:
  enabled: true
