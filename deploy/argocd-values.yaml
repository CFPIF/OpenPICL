global:
  domain: ""
configs:
  params:
    server.insecure: "true"
  cm:
    timeout.reconciliation: 60s
    helm.valuesFileSchemes: http,https
    # 恢复 Application 的健康检查，使 app-of-apps 中的 sync-wave 等待前一个应用 Healthy
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
      return hs
  repositories:
    # Envoy Gateway Helm Chart（OCI）：docker.io 无法直连，经 DaoCloud 镜像站拉取
    envoyproxy:
      name: envoyproxy
      type: helm
      url: docker.m.daocloud.io/envoyproxy
      enableOCI: "true"
    # ArgoCD 自身的 Helm Chart（OCI）：argoproj.github.io 无法直连
    argo-helm:
      name: argo-helm
      type: helm
      url: ghcr.io/argoproj/argo-helm
      enableOCI: "true"
    # cert-manager Helm Chart
    jetstack:
      name: jetstack
      type: helm
      url: https://charts.jetstack.io
# 仅使用 admin 账号，不需要 SSO；dex 镜像位于 ghcr.io，拉取不稳定
dex:
  enabled: false
server:
  service:
    type: NodePort
    nodePortHttp: 30080
redis-ha:
  enabled: false
controller:
  replicas: 1
repoServer:
  replicas: 1
