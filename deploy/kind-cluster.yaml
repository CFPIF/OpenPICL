kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: openpicl
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8081
        protocol: TCP
      - containerPort: 30443
        hostPort: 8443
        protocol: TCP
    extraMounts:
      - hostPath: /etc/containerd/certs.d
        containerPath: /etc/containerd/certs.d
        readOnly: true
  - role: worker
    extraMounts:
      - hostPath: /etc/containerd/certs.d
        containerPath: /etc/containerd/certs.d
        readOnly: true