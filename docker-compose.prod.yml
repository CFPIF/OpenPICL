services:
  # Studio
  studio:
    image: ${STUDIO_IMAGE:-117.50.75.30:8080/cfpif/openpicl.studio}:${STUDIO_IMAGE_TAG:-latest}
    container_name: studio
    ports:
      - "${STUDIO_PORT:-3000}:3000"
    restart: unless-stopped
    networks:
      - openpicl-net

  # WebIDE
  webide:
    image: ${WEBIDE_IMAGE:-117.50.75.30:8080/cfpif/openpicl.webide}:${WEBIDE_IMAGE_TAG:-latest}
    container_name: webide
    ports:
      - "${WEBIDE_PORT:-3002}:3002"
    restart: unless-stopped
    networks:
      - openpicl-net

  # Website
  website:
    image: ${WEBSITE_IMAGE:-117.50.75.30:8080/cfpif/openpicl.website}:${WEBSITE_IMAGE_TAG:-latest}
    container_name: website
    ports:
      - "${WEBSITE_PORT:-3004}:3004"
    restart: unless-stopped
    networks:
      - openpicl-net

  # Docs
  docs:
    image: ${DOCS_IMAGE:-117.50.75.30:8080/cfpif/openpicl.docs}:${DOCS_IMAGE_TAG:-latest}
    container_name: docs
    ports:
      - "${DOCS_PORT:-3006}:3006"
    restart: unless-stopped
    networks:
      - openpicl-net

networks:
  openpicl-net:
    driver: bridge
    name: openpicl-net