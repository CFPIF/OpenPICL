[workspace]
authors = ["SolomonCaptain <scholar@mail.dlut.edu.cn>"]
channels = ["conda-forge"]
name = "OpenPICL"
platforms = [
    "linux-64"
]
version = "0.1.0"
preview = ["pixi-build"]
license = "GPL-3.0-or-later"
readme = "README.md"

[workspace.dependencies]
python = ">=3.14.6,<3.15"
maturin = ">=1.14.1,<1.15"

[dependencies]
pyphotensor-unit = { path = "packages/pyphotensor-unit" }

[feature.linux-64]
platforms = ["linux-64"]
dependencies = { ruff = ">=0.16.7,<0.17" }

[environments]
default = ["linux-64"]