[workspace]
members = [
    "crates/nebula",
    "crates/nebula-core",
    "crates/nebula-protos",
    "crates/photensor",
    "crates/photensor-burn",
    "crates/photensor-core",
    "crates/photensor-hw",
    "crates/photensor-macros",
    "crates/photensor-sim",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["SolomonCaptain"]
license-file = "LICENSE"

[workspace.dependencies]
anyhow = "1.0.104"
clap = "4.6.6"
colored = "3.1.1"
include_dir = "0.7.4"
serde = "1.0.229"
tera = "2.2.0"
toml = "1.1.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"