[workspace]
members = [
    "app",
    "frontend",
    "protocol",
    "renderer",
    "server",
    "worker",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["SolomonCaptain"]

[workspace.dependencies]
leptos = "0.8.20"
leptos_meta = "0.8.6"
leptos_router = "0.8.15"
leptos_axum = "0.8.10"
leptos_i18n = "0.6.2"

axum = "0.8.9"
cfg-if = "1.0.4"
console_error_panic_hook = "0.1.7"
console_log = "1.1.0"
http = "1.5.0"
log = "0.4.34"
simple_logger = "5.2.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tower = { version = "0.5.3", features = ["full"] }
tower-http = { version = "0.7.0", features = ["full"] }
wasm-bindgen = "0.2.127"

[[workspace.metadata.leptos]]
name = "studio"
bin-package = "server"
lib-package = "frontend"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "assets/style/main.scss"
assets-dir = "assets/public"
site-addr = "127.0.0.1:3779"
reload-port = 3780
end2end-cmd = "npx playwright test"
end2end-dir = "end2end"
browserquery = "defaults"
watch = false
env = "DEV"
bin-features = []
bin-default-features = false
lib-features = []
lib-default-features = false

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"